name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Environment
        run: |
          node --version
          npm --version
          java -version

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor and Build APK
        run: |
          echo "Starting Capacitor Sync..."

          node ./node_modules/@capacitor/cli/bin/capacitor sync android

          echo "Checking Capacitor Gradle settings..."

          if [ ! -f android/capacitor.settings.gradle ]; then
            echo "ERROR: capacitor.settings.gradle was not generated!"
            ls -la android/
            exit 1
          fi

          echo "Capacitor sync completed successfully."

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
